spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.options.model=x-ai/grok-code-fast-1
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/omniquiz
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Spring Data JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.name=admin
spring.security.user.password=admin

security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

# Rate limiting (Bucket4j)
security.rate-limit.auth.requests=5
security.rate-limit.auth.duration=PT1M
security.rate-limit.api.requests=60
security.rate-limit.api.duration=PT1M

